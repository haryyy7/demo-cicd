name: Docker CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build vote image
        run: docker build -t voting-vote ./vote

      - name: Build result image
        run: docker build -t voting-result ./result

      - name: Build worker image
        run: docker build -t voting-worker ./worker

      - name: Verify images
        run: docker images
